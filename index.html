<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Preview your design - POD AI Design Preview">
  <title>Preview Design - POD AI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dark Overlay Background -->
  <div class="overlay" id="previewOverlay">
    <!-- Popup Card -->
    <div class="popup" id="previewPopup">
      <!-- Close Button (top-right, absolute) -->
      <button class="close-btn" id="closeBtn" aria-label="Close preview">
        <svg width="20" height="20" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24.6584 14.168L20 18.8263L15.3417 14.168L14.1667 15.343L18.825 20.0013L14.1667 24.6596L15.3417 25.8346L20 21.1763L24.6584 25.8346L25.8334 24.6596L21.175 20.0013L25.8334 15.343L24.6584 14.168Z" fill="black"/>
        </svg>
      </button>

      <!-- Header -->
      <div class="popup-header">
        <h4 class="popup-title">Preview your design</h4>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <!-- Blurred Preview Image -->
        <img src="assets/content_preview_v2.png" alt="Design Preview" class="preview-image" id="previewImage">

        <!-- Gradient Overlay (transparent top → dark bottom) -->
        <div class="gradient-overlay" id="gradientOverlay"></div>

        <!-- Centered Spinner Loader -->
        <div class="center-loader" id="centerLoader">
          <div class="loader"></div>
        </div>

        <!-- Progress Area (bottom of content) -->
        <div class="progress-area" id="progressArea">
          <div class="progress-row">
            <div class="apply-detail">
              <span class="apply-text" id="applyText">Appling Number of Dogs...</span>
            </div>
            <span class="progress-percent" id="progressPercent">10%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill" style="width: 10%"></div>
          </div>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="cta-area">
        <button class="cta-btn" id="ctaBtn" disabled>
          <svg class="spinner-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <mask id="path-1-inside-1_0_47" fill="white">
              <path d="M15.1263 11.6354C15.9536 10.0136 16.203 8.15804 15.8333 6.37533C15.4635 4.59261 14.4968 2.98934 13.0927 1.83034C11.6886 0.671338 9.93112 0.0259453 8.11064 0.00076514C6.29016 -0.024415 4.51554 0.572124 3.07992 1.69185C1.6443 2.81157 0.633553 4.38749 0.214642 6.1593C-0.20427 7.9311 -0.00628785 9.7928 0.775885 11.4369C1.55806 13.081 2.87763 14.4091 4.51663 15.2018C6.15564 15.9946 8.01602 16.2045 9.79049 15.7971L9.5142 14.5939C8.01355 14.9385 6.44025 14.7609 5.05417 14.0905C3.66808 13.4201 2.55214 12.2969 1.89067 10.9065C1.22919 9.51615 1.06176 7.94174 1.41603 6.44334C1.7703 4.94495 2.62507 3.61222 3.83916 2.66528C5.05324 1.71835 6.55401 1.21386 8.09357 1.23516C9.63313 1.25645 11.1194 1.80225 12.3068 2.7824C13.4942 3.76255 14.3118 5.11842 14.6245 6.62604C14.9372 8.13365 14.7263 9.70284 14.0266 11.0744L15.1263 11.6354Z"/>
            </mask>
            <path d="M15.1263 11.6354C15.9536 10.0136 16.203 8.15804 15.8333 6.37533C15.4635 4.59261 14.4968 2.98934 13.0927 1.83034C11.6886 0.671338 9.93112 0.0259453 8.11064 0.00076514C6.29016 -0.024415 4.51554 0.572124 3.07992 1.69185C1.6443 2.81157 0.633553 4.38749 0.214642 6.1593C-0.20427 7.9311 -0.00628785 9.7928 0.775885 11.4369C1.55806 13.081 2.87763 14.4091 4.51663 15.2018C6.15564 15.9946 8.01602 16.2045 9.79049 15.7971L9.5142 14.5939C8.01355 14.9385 6.44025 14.7609 5.05417 14.0905C3.66808 13.4201 2.55214 12.2969 1.89067 10.9065C1.22919 9.51615 1.06176 7.94174 1.41603 6.44334C1.7703 4.94495 2.62507 3.61222 3.83916 2.66528C5.05324 1.71835 6.55401 1.21386 8.09357 1.23516C9.63313 1.25645 11.1194 1.80225 12.3068 2.7824C13.4942 3.76255 14.3118 5.11842 14.6245 6.62604C14.9372 8.13365 14.7263 9.70284 14.0266 11.0744L15.1263 11.6354Z" stroke="white" stroke-width="2" mask="url(#path-1-inside-1_0_47)"/>
          </svg>
          <span class="cta-text">Starting</span>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
