<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 8 dots in a tight circle, radius=8px from center(12,12) -->
  
  <!-- Dot 1: 0° (Right) -->
  <circle cx="20" cy="12" r="2" fill="#808C90" opacity="1"/>
  
  <!-- Dot 2: 45° (Bottom-right) -->
  <circle cx="17.66" cy="17.66" r="1.85" fill="#808C90" opacity="0.875"/>
  
  <!-- Dot 3: 90° (Bottom) -->
  <circle cx="12" cy="20" r="1.7" fill="#808C90" opacity="0.75"/>
  
  <!-- Dot 4: 135° (Bottom-left) -->
  <circle cx="6.34" cy="17.66" r="1.55" fill="#808C90" opacity="0.625"/>
  
  <!-- Dot 5: 180° (Left) -->
  <circle cx="4" cy="12" r="1.4" fill="#808C90" opacity="0.5"/>
  
  <!-- Dot 6: 225° (Top-left) -->
  <circle cx="6.34" cy="6.34" r="1.25" fill="#808C90" opacity="0.375"/>
  
  <!-- Dot 7: 270° (Top) -->
  <circle cx="12" cy="4" r="1.1" fill="#808C90" opacity="0.25"/>
  
  <!-- Dot 8: 315° (Top-right) -->
  <circle cx="17.66" cy="6.34" r="1" fill="#808C90" opacity="0.125"/>
</svg>
